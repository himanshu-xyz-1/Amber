version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: amber-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amber_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-amber_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amber} -d ${POSTGRES_DB:-amber_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - amber-network

  redis:
    image: redis:7-alpine
    container_name: amber-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - amber-network

  whatsapp-bridge:
    build:
      context: ./services/whatsapp-bridge
      dockerfile: Dockerfile
    image: amber-whatsapp-bridge:latest
    container_name: amber-whatsapp-bridge
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - whatsapp_sessions:/app/sessions
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3001/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - amber-network

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    image: amber-backend:latest
    container_name: amber-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whatsapp-bridge:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-amber}:${POSTGRES_PASSWORD:-amber_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-amber_db}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - WHATSAPP_BRIDGE_URL=http://whatsapp-bridge:3001
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend:/app/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    networks:
      - amber-network

  telegram-bot:
    image: amber-backend:latest
    container_name: amber-telegram-bot
    restart: unless-stopped
    command: ["python", "-m", "backend.app.integrations.telegram_bot"]
    env_file:
      - .env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app/backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-amber}:${POSTGRES_PASSWORD:-amber_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-amber_db}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - ENVIRONMENT=production
    networks:
      - amber-network

volumes:
  postgres_data:
  redis_data:
  whatsapp_sessions:

networks:
  amber-network:
    driver: bridge
